-- Ativar modo leve
local function ativarModoLeve()
    pcall(function()
        game:GetService("Lighting").FogEnd = 100
        game:GetService("Lighting").Brightness = 0
        game:GetService("Lighting").GlobalShadows = false
    end)
end

task.spawn(function()
    while true do
        ativarModoLeve()
        task.wait(10)
    end
end)

-- Função para organizar frutas
local organizando = false
local function organizarFrutas()
    organizando = true
    while organizando do
        -- Tabela de controle de frutas já posicionadas
        local frutasColocadas = {}

        for _,v in pairs(game.Workspace:GetDescendants()) do
            pcall(function()
                if v:IsA("Tool") and string.find(v.Name, "Fruit") and v.Parent == game.Workspace then
                    if not frutasColocadas[v.Name] then
                        -- Primeira fruta desse tipo → traz pra sua frente
                        v.Handle.CFrame = game.Players.LocalPlayer.Character.HumanoidRootPart.CFrame * CFrame.new(0, 0, -3)
                        frutasColocadas[v.Name] = true
                    else
                        -- Demais frutas desse tipo → joga pra posição aleatória
                        local randomPos = CFrame.new(math.random(-5000,5000), 300, math.random(-5000,5000))
                        v.Handle.CFrame = randomPos
                    end
                end
            end)
        end
        task.wait(0.5)
    end
end

-- Anti-AFK
pcall(function()
    local vu = game:GetService("VirtualUser")
    game:GetService("Players").LocalPlayer.Idled:Connect(function()
        vu:Button2Down(Vector2.new(0,0), workspace.CurrentCamera.CFrame)
        task.wait(1)
        vu:Button2Up(Vector2.new(0,0), workspace.CurrentCamera.CFrame)
    end)
end)

-- Notificação inicial
pcall(function()
    game.StarterGui:SetCore("SendNotification", {
        Title = "Organizador de Frutas";
        Text = "Mantendo só uma de cada tipo perto.";
        Duration = 5;
    })
end)

-- Botão Farm
FarmButton.MouseButton1Click:Connect(function()
    if not organizando then
        organizarFrutas()
    end
end)

-- Botão Fechar
FecharButton.MouseButton1Click:Connect(function()
    organizando = false
    ScreenGui:Destroy()
end)
